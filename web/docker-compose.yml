services:
  steamplant-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: steamplant-web
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      MACHINE_TOKEN: "${MACHINE_TOKEN}"
      ADMIN_TOKEN: "${ADMIN_TOKEN}"
      HISTORY_LIMIT: "500"
      ATTACC_REPOSITORY_DIR: "/repo"
      ATTACC_REPOSITORY_PUBLIC_URL: "${ATTACC_REPOSITORY_PUBLIC_URL:-}"
    volumes:
      - ./data:/data
      - ${ATTACC_REPOSITORY_PATH:-../}:/repo:ro
