name: SDK Lua checks
on:
  push:
    branches: [feature/v1.1-sdk-unification]
  pull_request:
    branches: [feature/v1.1-sdk-unification]
  workflow_dispatch:
jobs:
  lua:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.3
      - name: Parse all Lua sources
        run: |
          find core modules apps tests -type f -name '*.lua' -print0 | xargs -0 -n1 luac5.3 -p
      - name: Check SDK application network boundaries
        run: |
          if grep -nE 'modem[.](open|transmit)|rednet[.]|http[.]websocket|os[.]pullEvent' apps/master/sdk_main.lua apps/master/sdk_webbridge.lua apps/node_agent/main.lua apps/steamplant/main.lua apps/pocket/sdk_main.lua apps/workstation/sdk_main.lua apps/storage/sdk_main.lua; then
            echo "Direct network access found in native SDK apps" >&2
            exit 1
          fi
      - name: Validate native package destinations
        run: |
          lua5.3 - <<'LUA'
          local manifest=dofile("packages/manifest.lua")
          for name,def in pairs(manifest.packages) do
            if def.kind=="app" and def.sdkNative then
              local id=name:match("^app%.([%w_%-]+)$")
              assert(id,"invalid native app package "..name)
              for _,file in ipairs(def.files or {}) do
                local dest=file.dest or file.src
                if dest:match("^apps/") then
                  assert(dest:sub(1,#("apps/"..id.."/"))=="apps/"..id.."/",
                    "native app package directory mismatch: "..name.." -> "..dest)
                end
              end
            end
          end
          for alias,name in pairs(manifest.aliases or {}) do
            assert(manifest.packages[name], "broken package alias "..alias)
          end
          print("SDK native package layout OK")
          LUA
      - name: SDK control regression tests
        run: |
          lua5.3 tests/sdk_v11_admin_spec.lua
          lua5.3 tests/sdk_v11_storage_spec.lua
          lua5.3 tests/sdk_v11_storage_ack_spec.lua
          lua5.3 tests/sdk_v11_events_spec.lua
          lua5.3 tests/sdk_v11_nodes_spec.lua
          lua5.3 tests/sdk_v11_remote_spec.lua
          lua5.3 tests/sdk_v11_snapshots_auth_spec.lua
          lua5.3 tests/sdk_v11_command_dispatch_spec.lua
