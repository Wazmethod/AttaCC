name: Lua syntax
on:
  push:
    branches: ["feature/v1.1-sdk-unification"]
  pull_request:
    paths:
      - "**/*.lua"
      - ".github/workflows/lua-syntax.yml"
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.2 compiler (CraftOS compatible syntax)
        run: sudo apt-get update && sudo apt-get install -y lua5.2
      - name: Compile all Lua files without executing them
        shell: bash
        run: |
          set -euo pipefail
          find . -type f -name '*.lua' -print0 | while IFS= read -r -d '' file; do
            echo "Checking $file"
            luac5.2 -p "$file"
          done
